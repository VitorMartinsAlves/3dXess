<!DOCTYPE html><html><body>
<script src="engine.js"></script>
<script src="bot.js"></script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    try {
      var st = Chess.createInitialState();
      var t0 = performance.now();
      var r = Bot.chooseMove(st, { level: 3, style: 'balanced' });
      document.title = 'BOT ' + (r && r.uci) + ' in ' + Math.round(performance.now() - t0) + 'ms';
    } catch (e) { document.title = 'ERR ' + (e && e.message); }
  }, 100);
});
</script>
</body></html>
