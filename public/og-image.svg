<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1" r="0.7">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="board" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#ffffff" fill-opacity="0.035"/>
      <rect x="32" y="32" width="32" height="32" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b0f14"/>
  <rect width="1200" height="630" fill="url(#board)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Cavalo -->
  <text x="935" y="500" font-family="DejaVu Sans" font-size="520" text-anchor="middle"
        fill="#6ee7b7" fill-opacity="0.55" filter="url(#soft)">&#9822;</text>
  <text x="935" y="500" font-family="DejaVu Sans" font-size="520" text-anchor="middle"
        fill="url(#accent)">&#9822;</text>

  <!-- Texto -->
  <text x="88" y="176" font-family="DejaVu Sans" font-size="24" font-weight="bold"
        letter-spacing="4" fill="#6ee7b7">XADREZ NO NAVEGADOR</text>

  <text x="86" y="288" font-family="DejaVu Sans" font-size="92" font-weight="bold" fill="#e8eef7">Xadrez 3D</text>
  <text x="86" y="386" font-family="DejaVu Sans" font-size="92" font-weight="bold" fill="url(#accent)">Online</text>

  <text x="88" y="452" font-family="DejaVu Sans" font-size="27" fill="#8b9bb0">Jogue grátis, sem cadastro e sem instalar nada.</text>

  <!-- Selos -->
  <g font-family="DejaVu Sans" font-size="20" fill="#e8eef7">
    <rect x="88" y="494" width="176" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="176" y="525" text-anchor="middle">Contra o bot</text>

    <rect x="280" y="494" width="164" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="362" y="525" text-anchor="middle">Com amigos</text>

    <rect x="460" y="494" width="164" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="542" y="525" text-anchor="middle">Modo local</text>
  </g>
</svg>
