name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes e build
        run: |
          npm test
          npm run build
