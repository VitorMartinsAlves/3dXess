name: Build estático para GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# The site is published from main:/ by GitHub Pages.
# Do not call actions/deploy-pages here: the Pages branch source performs
# the deployment after the generated static files are pushed.
permissions:
  contents: write

concurrency:
  group: 3dxess-vite-site
  cancel-in-progress: true

jobs:
  build:
    # A build-generated commit must not start another build.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Executar testes
        run: npm test

      - name: Gerar aplicação React
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}

      # Keep main:/ synchronized with dist for the existing branch-based
      # GitHub Pages publishing source.
      - name: Publicar build estático na raiz da main
        run: |
          node scripts/publish-branch-build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "O build estático já está atualizado na raiz."
          else
            git commit -m "chore(pages): publish generated static site"
            git push origin HEAD:main
          fi
