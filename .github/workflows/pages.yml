name: Build e deploy no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 3dxess-vite-site
  cancel-in-progress: true

jobs:
  build:
    # A build-generated commit must not start another build.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Executar testes
        run: npm test

      - name: Gerar aplicação React
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Enviar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Compatibilidade com a configuração atual do repositório:
      # se Pages estiver em "Deploy from a branch", main:/ também contém
      # o build estático pronto, em vez do index.html de desenvolvimento.
      - name: Espelhar o build estático na raiz da main
        run: |
          node scripts/publish-branch-build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "O build estático já está atualizado na raiz."
          else
            git commit -m "chore(pages): publish generated static site"
            git push origin HEAD:main
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
