name: Testes

on:
  pull_request:
    branches: [main, master]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes e verificações
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar testes
        run: npm test
